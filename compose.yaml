services:
  app:
    build: .
    image: vollzanbel:local
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      LOG_LEVEL_HIBERNATE_SQL: ${LOG_LEVEL_HIBERNATE_SQL:-INFO}
      LOG_LEVEL_HIBERNATE_BIND: ${LOG_LEVEL_HIBERNATE_BIND:-INFO}
    restart: unless-stopped
