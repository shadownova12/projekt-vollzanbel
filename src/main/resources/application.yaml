spring:
  application:
    name: vollzanbel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vollzanbel}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      # Supabase/PgBouncer transaction pooling can reuse a backend connection
      # whose server-side prepared statements were created by another client.
      # Disable PostgreSQL server-side preparation for pooled development traffic.
      data-source-properties:
        prepareThreshold: 0

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

server:
  servlet:
    context-path: /vollzanbel-api

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:TRACE}
